name: Build Tarkov Atlas Windows

on:
  push:
    branches:
      - tarkov-atlas-build

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: Checkout independent Tarkov Atlas source
        uses: actions/checkout@v4
        with:
          ref: tarkov-atlas-build

      - name: Checkout pinned 0.9.0 quest snapshot only (not app code)
        uses: actions/checkout@v4
        with:
          repository: mopocop/Tarkov-moa
          ref: v0.9.0
          path: tarkov-atlas/vendor/Tarkov-moa-0.9.0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tarkov-atlas/requirements.txt

      - name: Setup Node for JavaScript validation
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle 11 licensed vector maps for offline operation
        working-directory: tarkov-atlas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinnedCommit = '5a8b6115d1c0cf56f2ebaac1a96fa5ae3074d178'
          $baseUrl = "https://raw.githubusercontent.com/the-hideout/tarkov-dev-svg-maps/$pinnedCommit"
          $names = @(
            'Customs', 'Factory', 'GroundZero', 'Interchange', 'Labs',
            'Lighthouse', 'Reserve', 'Shoreline', 'StreetsOfTarkov',
            'Terminal', 'Woods'
          )
          New-Item -ItemType Directory -Path 'web/maps' -Force | Out-Null
          New-Item -ItemType Directory -Path 'web/data' -Force | Out-Null
          foreach ($name in $names) {
            $target = "web/maps/$name.svg"
            Invoke-WebRequest -Uri "$baseUrl/$name.svg" -OutFile $target
            if ((Get-Item $target).Length -lt 10000) { throw "Incomplete map: $target" }
            $xml = [xml](Get-Content $target -Raw)
            if ($xml.DocumentElement.LocalName -ne 'svg') { throw "Not SVG: $target" }
            Write-Host "Bundled $target ($((Get-Item $target).Length) bytes)"
          }
          Invoke-WebRequest -Uri "$baseUrl/LICENSE.md" -OutFile 'web/maps/LICENSE.md'
          @"
          Offline map drawings: the-hideout/tarkov-dev-svg-maps
          Source: https://github.com/the-hideout/tarkov-dev-svg-maps
          Commit: $pinnedCommit
          License: CC BY-NC-SA 4.0 (see LICENSE.md). Artworks are unmodified.
          "@ | Set-Content -Path 'web/maps/ATTRIBUTION.txt' -Encoding UTF8
          Copy-Item 'vendor/Tarkov-moa-0.9.0/LICENSE' 'web/data/TARKOV-MOA-LICENSE.txt' -Force

      - name: Install Python desktop/build dependencies
        working-directory: tarkov-atlas
        run: python -m pip install -r requirements.txt

      - name: Build offline quest archive and validate source
        working-directory: tarkov-atlas
        shell: pwsh
        run: |
          python tools/build_data.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline data conversion failed' }
          python -m py_compile app.py tools/build_data.py
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax invalid' }
          node --check web/app.js
          if ($LASTEXITCODE -ne 0) { throw 'JavaScript syntax invalid' }
          python app.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Offline asset self-test failed' }

      - name: Package independent Windows desktop application
        working-directory: tarkov-atlas
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --onedir --collect-all webview --hidden-import webview.platforms.edgechromium --hidden-import clr --add-data "web;web" --name TarkovAtlas app.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed' }
          if (!(Test-Path 'dist/TarkovAtlas/TarkovAtlas.exe')) { throw 'Missing packaged executable' }
          if (!(Test-Path 'dist/TarkovAtlas/_internal/web/maps/Woods.svg')) { throw 'Missing embedded maps' }
          if (!(Test-Path 'dist/TarkovAtlas/_internal/web/data/quests.json')) { throw 'Missing embedded quests' }

      - name: Packaged app asset self-test
        working-directory: tarkov-atlas
        shell: pwsh
        run: |
          $p=Start-Process -FilePath 'dist/TarkovAtlas/TarkovAtlas.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged self-test failed: $($p.ExitCode)" }
          Write-Host 'PASS: packaged EXE can access all offline resources'

      - name: Windows GUI startup smoke test
        working-directory: tarkov-atlas
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe=(Resolve-Path 'dist/TarkovAtlas/TarkovAtlas.exe').Path
          $p=Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 9
          $p.Refresh()
          if ($p.HasExited) { throw "Desktop app exited during startup: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host 'PASS: Windows GUI process remained running'

      - name: Build Windows installer (NSIS)
        working-directory: tarkov-atlas
        shell: pwsh
        run: |
          $nsis='C:\Program Files (x86)\NSIS\makensis.exe'
          if (!(Test-Path $nsis)) {
            choco install nsis -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Unable to install NSIS' }
          }
          if (!(Test-Path $nsis)) { throw 'makensis.exe unavailable' }
          & $nsis 'installer.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installer compilation failed' }
          if (!(Test-Path 'TarkovAtlas-0.1.0-Setup.exe')) { throw 'Missing Windows setup EXE' }

      - name: Package ready-to-run folder
        working-directory: tarkov-atlas
        shell: pwsh
        run: Compress-Archive -Path 'dist/TarkovAtlas/*' -DestinationPath 'TarkovAtlas-0.1.0-Portable.zip'

      - name: Upload verified Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: TarkovAtlas-0.1.0-Windows
          path: |
            tarkov-atlas/TarkovAtlas-0.1.0-Setup.exe
            tarkov-atlas/TarkovAtlas-0.1.0-Portable.zip
          if-no-files-found: error
