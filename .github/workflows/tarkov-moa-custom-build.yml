name: Build Tarkov MoA Custom

on:
  push:
    branches:
      - tarkov-moa-custom-build

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Tarkov MoA 0.9.0
        uses: actions/checkout@v4
        with:
          repository: mopocop/Tarkov-moa
          ref: v0.9.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Apply custom patch
        shell: pwsh
        run: |
          @'
          import type { DrawPayload } from '../../shared/squadProtocol';

          const STORAGE_KEY = 'tc_draws_v1';
          const MAX_STORED_STROKES = 300;

          function isPoint(value: unknown): value is { x: number; z: number } {
            if (!value || typeof value !== 'object') return false;
            const p = value as { x?: unknown; z?: unknown };
            return typeof p.x === 'number' && Number.isFinite(p.x) && typeof p.z === 'number' && Number.isFinite(p.z);
          }

          function isDrawPayload(value: unknown): value is DrawPayload {
            if (!value || typeof value !== 'object') return false;
            const d = value as Partial<DrawPayload>;
            return (
              typeof d.id === 'string' &&
              typeof d.mapId === 'string' &&
              typeof d.color === 'string' &&
              Array.isArray(d.points) &&
              d.points.length >= 2 &&
              d.points.every(isPoint)
            );
          }

          export function loadOwnDraws(): DrawPayload[] {
            try {
              const raw = localStorage.getItem(STORAGE_KEY);
              if (!raw) return [];
              const parsed = JSON.parse(raw) as unknown;
              if (!Array.isArray(parsed)) return [];
              return parsed.filter(isDrawPayload).slice(-MAX_STORED_STROKES);
            } catch {
              return [];
            }
          }

          export function saveOwnDraws(draws: DrawPayload[]): void {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(draws.slice(-MAX_STORED_STROKES)));
            } catch {
              // Drawing continues to work even if local storage is unavailable.
            }
          }
          '@ | Set-Content -Path 'src/map/drawStore.ts' -Encoding utf8

          $app = Get-Content 'src/App.tsx' -Raw
          $app = $app.Replace(
            "import { newDrawId } from './map/drawId';",
            "import { newDrawId } from './map/drawId';`nimport { loadOwnDraws, saveOwnDraws } from './map/drawStore';"
          )
          $app = $app.Replace(
            "const [ownDraws, setOwnDraws] = useState<DrawPayload[]>([]); // in-memory, session-only",
            "const [ownDraws, setOwnDraws] = useState<DrawPayload[]>(() => loadOwnDraws());"
          )
          $anchor = @'
            // Persist custom markers whenever they change.
            useEffect(() => {
              saveCustomPois(customPois);
            }, [customPois]);
          '@
          $replacement = @'
            // Persist custom markers whenever they change.
            useEffect(() => {
              saveCustomPois(customPois);
            }, [customPois]);

            // Keep locally-authored routes and notes across app restarts.
            useEffect(() => {
              saveOwnDraws(ownDraws);
            }, [ownDraws]);
          '@
          if (-not $app.Contains($anchor)) { throw 'App.tsx persistence anchor not found' }
          $app = $app.Replace($anchor, $replacement)
          Set-Content -Path 'src/App.tsx' -Value $app -Encoding utf8

          # Custom builds must not register the official updater without its required config.
          # In 0.9.1 this mismatch caused an early Rust panic (Windows 0xc0000409).
          $main = Get-Content 'src-tauri/src/main.rs' -Raw
          $updaterLine = '        .plugin(tauri_plugin_updater::Builder::new().build())'
          if (-not $main.Contains($updaterLine)) { throw 'Updater plugin line not found in main.rs' }
          $main = $main.Replace("$updaterLine`r`n", '')
          $main = $main.Replace("$updaterLine`n", '')
          Set-Content 'src-tauri/src/main.rs' -Value $main -Encoding utf8

          $cfg = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $cfg.productName = 'Tarkov MoA Custom'
          $cfg.version = '0.9.3'
          $cfg.identifier = 'com.tarkov-moa.custom'
          $cfg.app.windows[0].title = 'Tarkov MoA Custom'
          $cfg.bundle.createUpdaterArtifacts = $false
          $cfg.bundle.publisher = 'Tarkov MoA Custom'
          $cfg.PSObject.Properties.Remove('plugins')
          $cfg | ConvertTo-Json -Depth 20 | Set-Content 'src-tauri/tauri.conf.json' -Encoding utf8

          $cargo = Get-Content 'src-tauri/Cargo.toml' -Raw
          $cargo = $cargo.Replace('version = "0.8.1"', 'version = "0.9.3"')
          Set-Content 'src-tauri/Cargo.toml' -Value $cargo -Encoding utf8


      - name: Bundle original SVG maps for offline operation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $upstreamCommit = '5a8b6115d1c0cf56f2ebaac1a96fa5ae3074d178'
          $baseUrl = "https://raw.githubusercontent.com/the-hideout/tarkov-dev-svg-maps/$upstreamCommit"
          $names = @(
            'Customs', 'Factory', 'GroundZero', 'Interchange', 'Labs',
            'Lighthouse', 'Reserve', 'Shoreline', 'StreetsOfTarkov',
            'Terminal', 'Woods'
          )
          New-Item -ItemType Directory -Path 'public/maps' -Force | Out-Null
          foreach ($name in $names) {
            $target = "public/maps/$name.svg"
            Invoke-WebRequest -Uri "$baseUrl/$name.svg" -OutFile $target
            if ((Get-Item $target).Length -lt 10000) { throw "Offline map $name.svg appears incomplete" }
            try {
              $xml = [xml](Get-Content $target -Raw)
              if ($xml.DocumentElement.LocalName -ne 'svg') { throw "Not an SVG" }
            } catch { throw "Invalid downloaded SVG $name.svg : $_" }
            Write-Host "$name.svg bundled, $((Get-Item $target).Length) bytes"
          }
          Invoke-WebRequest -Uri "$baseUrl/LICENSE.md" -OutFile 'public/maps/LICENSE.md'
          @"
          Bundled map illustrations from the-hideout/tarkov-dev-svg-maps
          Upstream commit: $upstreamCommit
          License: Creative Commons Attribution-NonCommercial-ShareAlike 4.0
          Source: https://github.com/the-hideout/tarkov-dev-svg-maps
          Copyright belongs to the respective authors; illustrations are unmodified.
          See LICENSE.md for details.
          "@ | Set-Content -Path 'public/maps/ATTRIBUTION.txt' -Encoding utf8
          $definitions = Get-Content 'src/map/mapDefs.ts' -Raw
          $remotePrefix = 'https://assets.tarkov.dev/maps/svg/'
          $count = ([regex]::Matches($definitions, [regex]::Escape($remotePrefix))).Count
          if ($count -ne 11) { throw "Expected 11 remote map URLs, found $count" }
          $definitions = $definitions.Replace($remotePrefix, '/maps/')
          Set-Content 'src/map/mapDefs.ts' -Value $definitions -Encoding utf8
          if ($definitions.Contains($remotePrefix)) { throw "Remote map URLs still present" }

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run tauri:build

      - name: Verify bundled maps in production output
        shell: pwsh
        run: |
          $names = @(
            'Customs', 'Factory', 'GroundZero', 'Interchange', 'Labs',
            'Lighthouse', 'Reserve', 'Shoreline', 'StreetsOfTarkov',
            'Terminal', 'Woods'
          )
          foreach ($name in $names) {
            $target = "dist/maps/$name.svg"
            if (!(Test-Path $target)) { throw "Missing production map asset: $target" }
            if ((Get-Item $target).Length -lt 10000) { throw "Incomplete production map asset: $target" }
          }
          $bundle = Get-ChildItem -Path dist/assets -Filter '*.js' | Get-Content -Raw
          if ($bundle -match 'https://assets.tarkov.dev/maps/svg/') {
            throw "Production JS still references remote SVG maps"
          }
          Write-Host 'PASS: all 11 map assets embedded in production build. No external map SVG URLs.'

      - name: Smoke-test Windows executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src-tauri/target/release/tarkov-companion.exe'
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) {
            throw "tarkov-companion.exe exited during startup smoke test with code $($p.ExitCode)"
          }
          Stop-Process -Id $p.Id -Force
          Write-Host 'Startup smoke test passed: application remained running.'

      - name: Show installer
        shell: pwsh
        run: Get-ChildItem -Path 'src-tauri/target/release/bundle/nsis' -Filter '*.exe'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Tarkov-MoA-Custom-0.9.3-OfflineMaps-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
